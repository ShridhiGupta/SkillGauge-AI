version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: skillgauge-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: skillgauge
    volumes:
      - mongodb_data:/data/db
      - ./mongodb/init:/docker-entrypoint-initdb.d
    networks:
      - skillgauge-network

  # Redis for caching
  redis:
    image: redis:7.2-alpine
    container_name: skillgauge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - skillgauge-network

  # Ollama LLM Service
  ollama:
    image: ollama/ollama:latest
    container_name: skillgauge-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    networks:
      - skillgauge-network
    # Pull models on startup
    entrypoint: >
      sh -c "
      ollama serve &
      sleep 10 &&
      ollama pull codellama &&
      ollama pull llama2 &&
      wait
      "

  # Backend Node.js Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skillgauge-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/skillgauge?authSource=admin
      REDIS_URL: redis://redis:6379
      AI_ENGINE_URL: http://ai-engine:8000
      FRONTEND_URL: http://localhost:3000
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_EXPIRE: 7d
    depends_on:
      - mongodb
      - redis
      - ai-engine
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/uploads:/app/uploads
    networks:
      - skillgauge-network

  # AI Engine Python Service
  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: skillgauge-ai-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: /app
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: codellama
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: INFO
    depends_on:
      - ollama
      - redis
    volumes:
      - ./ai-engine/logs:/app/logs
    networks:
      - skillgauge-network

  # Frontend React Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skillgauge-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      REACT_APP_SERVER_URL: http://localhost:3001
      REACT_APP_WS_URL: http://localhost:3001
    depends_on:
      - backend
    networks:
      - skillgauge-network

  # Nginx Reverse Proxy (Optional for production)
  nginx:
    image: nginx:alpine
    container_name: skillgauge-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    networks:
      - skillgauge-network
    profiles:
      - production

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  ollama_data:
    driver: local

networks:
  skillgauge-network:
    driver: bridge
